<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#6B2737"/>
  <!-- Piano keys -->
  <rect x="7" y="9" width="18" height="14" rx="1" fill="#F5EDE0"/>
  <!-- White key dividers -->
  <line x1="11" y1="9" x2="11" y2="23" stroke="#6B2737" stroke-width="0.8"/>
  <line x1="15" y1="9" x2="15" y2="23" stroke="#6B2737" stroke-width="0.8"/>
  <line x1="19" y1="9" x2="19" y2="23" stroke="#6B2737" stroke-width="0.8"/>
  <line x1="23" y1="9" x2="23" y2="23" stroke="#6B2737" stroke-width="0.8"/>
  <!-- Black keys -->
  <rect x="9.5" y="9" width="2.5" height="8" fill="#2D1B1E"/>
  <rect x="13.5" y="9" width="2.5" height="8" fill="#2D1B1E"/>
  <rect x="21" y="9" width="2.5" height="8" fill="#2D1B1E"/>
  <!-- Gold accent bar -->
  <rect x="7" y="24.5" width="18" height="1.5" rx="0.75" fill="#C9A24B"/>
</svg>